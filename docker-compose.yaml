services:
  ilter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8181:8181"
      - "9191:9191"
      - "9192:9192"
    environment:
      - ILTER_STORAGE_PATH=/app/data/ilter.db
    depends_on:
      - redis
    volumes:
      - ilter_data:/app/data

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ilter_data:
  redis_data:
  ollama_data:
