  /webhooks/{token}:
    post:
      tags: [Admin]
      servers:
        - url: http://127.0.0.1:9191
      summary: Webhook Entry
      description: |
        External unauthenticated endpoint for receiving webhook events.
        HMAC verification is performed using SHA-256.
        Returns 202 Accepted with run_id on success, or 401 on HMAC failure.
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              description: Raw webhook payload
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            description: Webhook token (wht_ prefix)
      responses:
        '202':
          description: Webhook accepted — polling endpoint (use run_id with GET /api/jobs/{id}/runs/{runId})
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    description: The run ID to poll for completion
        '401':
          description: HMAC verification failed or trigger not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Trigger not found or verification failed
                      type:
                        type: string
                        example: verification_failed

  /api/webhooks/{token}:
    post:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Webhook Entry
      description: |
        External unauthenticated endpoint for receiving webhook events.
        HMAC verification is performed using SHA-256.
        Returns 202 Accepted with run_id on success, or 401 on HMAC failure.
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              description: Raw webhook payload
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            description: Webhook token (wht_ prefix)
      responses:
        '202':
          description: Webhook accepted — polling endpoint (use run_id with GET /api/jobs/{id}/runs/{runId})
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                    description: The run ID to poll for completion
        '401':
          description: HMAC verification failed or trigger not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Trigger not found or verification failed
                      type:
                        type: string
                        example: verification_failed


  # ---------------------------------------------------------------------------
  # OAuth 2.0 — MCP Auth endpoints (RFC 8414, RFC 8707, RFC 7591, PKCE)
  # ---------------------------------------------------------------------------

  /.well-known/oauth-protected-resource:
    get:
      tags: [OAuth 2.0]
      servers:
        - url: http://127.0.0.1:8181
      summary: OAuth Protected Resource Metadata (RFC 8707)
      description: Returns metadata about the protected resource, used by MCP HTTP clients to discover bearer token requirements.
      responses:
        '200':
          description: Protected resource metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    description: The URL of the protected resource
                    example: http://127.0.0.1:8181
                  authorization_servers:
                    type: array
                    items:
                      type: string
                    description: List of authorization server URLs
                    example: ["http://127.0.0.1:8181"]
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                    description: Supported bearer token methods
                    example: ["header"]
                  resource_documentation:
                    type: string
                    description: Link to API documentation
                    example: http://127.0.0.1:8181/docs

  /.well-known/oauth-authorization-server:
    get:
      tags: [OAuth 2.0]
      servers:
        - url: http://127.0.0.1:8181
      summary: OAuth Authorization Server Metadata (RFC 8414)
      description: Returns authorization server metadata, used by MCP HTTP clients to discover OAuth endpoints.
      responses:
        '200':
          description: Authorization server metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                    description: The authorization server's issuer identifier
                    example: http://127.0.0.1:8181
                  authorization_endpoint:
                    type: string
                    description: URL of the authorization endpoint
                    example: http://127.0.0.1:8181/authorize
                  token_endpoint:
                    type: string
                    description: URL of the token endpoint
                    example: http://127.0.0.1:8181/token
                  registration_endpoint:
                    type: string
                    description: URL of the dynamic client registration endpoint
                    example: http://127.0.0.1:8181/register
                  response_types_supported:
                    type: array
                    items:
                      type: string
                    description: Supported OAuth response types
                    example: ["code"]
                  grant_types_supported:
                    type: array
                    items:
                      type: string
                    description: Supported OAuth grant types
                    example: ["authorization_code"]
                  code_challenge_methods_supported:
                    type: array
                    items:
                      type: string
                    description: Supported PKCE code challenge methods
                    example: ["S256"]
                  token_endpoint_auth_methods_supported:
                    type: array
                    items:
                      type: string
                    description: Supported token endpoint authentication methods
                    example: ["none"]
                  scopes_supported:
                    type: array
                    items:
                      type: string
                    description: Supported OAuth scopes
                    example: ["mcp"]

  /authorize:
    get:
      tags: [OAuth 2.0]
      servers:
        - url: http://127.0.0.1:8181
      summary: OAuth Authorization Page (redirect)
      description: |
        OAuth authorization endpoint. Validates PKCE parameters then redirects the
        browser to the dashboard consent page. This is step 4 of the MCP HTTP auth
        flow — the MCP client opens this URL in the user's browser.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
          description: Must be "code"
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: Client identifier
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          description: Redirect URI (must be a loopback address, localhost, or vscode://)
          example: http://127.0.0.1:34567
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
          description: PKCE code challenge method (only S256 supported)
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          description: PKCE code challenge (SHA-256 hash of code verifier, base64url-encoded)
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque state value for CSRF protection (recommended)
      responses:
        '302':
          description: Redirect to the dashboard consent page
          headers:
            Location:
              schema:
                type: string
              description: URL of the dashboard /authorize page with authorization params
        '400':
          $ref: '#/components/responses/OAuthError'
        '405':
          $ref: '#/components/responses/OAuthError'

    post:
      tags: [OAuth 2.0]
      servers:
        - url: http://127.0.0.1:8181
      summary: OAuth Authorization Consent
      description: |
        Called by the dashboard UI after user consent. Issues an opaque
        authorization code bound to an API key. Returns a redirect_uri so
        the dashboard JS can redirect the browser to the MCP client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - request_id
                - action
              properties:
                request_id:
                  type: string
                  description: Pending authorization request ID (from the GET redirect)
                action:
                  type: string
                  enum: [create_new, use_existing]
                  description: Whether to create a new API key or use an existing one
                api_key:
                  type: string
                  description: Existing API key (required when action=use_existing)
      responses:
        '200':
          description: Authorization code issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_uri:
                    type: string
                    description: Full redirect URI including code and state query params
                  code:
                    type: string
                    description: Opaque single-use authorization code
                  state:
                    type: string
                    description: State value echoed back for CSRF verification
        '400':
          $ref: '#/components/responses/OAuthError'
        '405':
          $ref: '#/components/responses/OAuthError'

  /token:
    post:
      tags: [OAuth 2.0]
      servers:
        - url: http://127.0.0.1:8181
      summary: OAuth Token Exchange (PKCE)
      description: |
        Exchanges an opaque authorization code for an access token (API key).
        Uses PKCE code verifier for proof-of-possession verification.
        Accepts both application/json and application/x-www-form-urlencoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - grant_type
              properties:
                code:
                  type: string
                  description: The authorization code from /authorize
                grant_type:
                  type: string
                  enum: [authorization_code]
                  description: Must be "authorization_code"
                code_verifier:
                  type: string
                  description: PKCE code verifier (plaintext secret)
                redirect_uri:
                  type: string
                  description: Redirect URI for validation (must match the one used in /authorize)
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: The authorization code
                grant_type:
                  type: string
                  enum: [authorization_code]
                  description: Must be "authorization_code"
                code_verifier:
                  type: string
                  description: PKCE code verifier
                redirect_uri:
                  type: string
                  description: Redirect URI for validation
      responses:
        '200':
          description: Token exchange successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The API key (Bearer token) for subsequent requests
                  token_type:
                    type: string
                    enum: [bearer]
                    example: bearer
                  scope:
                    type: string
                    description: Granted scope
                    example: mcp
                  redirect_uri:
                    type: string
                    description: Echoed redirect URI
                  state:
                    type: string
                    description: Echoed state value
        '400':
          $ref: '#/components/responses/OAuthError'
        '405':
          $ref: '#/components/responses/OAuthError'

  /register:
    get:
      tags: [OAuth 2.0]
      servers:
        - url: http://127.0.0.1:8181
      summary: OAuth Dynamic Client Registration (read — not implemented)
      description: GET is not supported. Use POST for dynamic client registration.
      responses:
        '405':
          $ref: '#/components/responses/OAuthError'

    post:
      tags: [OAuth 2.0]
      servers:
        - url: http://127.0.0.1:8181
      summary: OAuth Dynamic Client Registration (RFC 7591)
      description: Self-registers an MCP client. Accepts any body or no body — returns a fixed client configuration. Used by VSCode and other MCP HTTP clients.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional client metadata (currently ignored)
      responses:
        '201':
          description: Client registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                    description: The registered client identifier
                    example: ilter-mcp-client
                  client_secret_expires_at:
                    type: integer
                    description: Expiration timestamp (0 = never expires)
                    example: 0
                  grant_types:
                    type: array
                    items:
                      type: string
                    description: Allowed grant types
                    example: ["authorization_code"]
                  response_types:
                    type: array
                    items:
                      type: string
                    description: Allowed response types
                    example: ["code"]
                  token_endpoint_auth_method:
                    type: string
                    description: Token endpoint authentication method
                    example: none
        '400':
          $ref: '#/components/responses/OAuthError'
        '405':
          $ref: '#/components/responses/OAuthError'


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    APIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scopes:
          type: string
        budget:
          type: number
        rate_limit:
          type: integer
        created_at:
          type: string
    TriggerKind:
      type: string
      enum: [cron, webhook, http]
      description: Type of trigger
    TriggerConfig:
      type: object
      description: Kind-specific trigger configuration as JSON
      properties:
        expr:
          type: string
          description: Cron expression (e.g., "0 */6 * * *")
          example: 0 */6 * * *
        timezone:
          type: string
          default: UTC
          description: Timezone for cron scheduling
        auth:
          type: string
          description: Authentication type for HTTP triggers
        provider:
          type: string
          default: generic
          description: Webhook provider name
    TriggerResponse:
      type: object
      description: API response shape for a trigger
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/TriggerKind'
        enabled:
          type: boolean
        config:
          $ref: '#/components/schemas/TriggerConfig'
        token:
          type: string
          description: Raw webhook token (only returned on create)
        created_at:
          type: string
          format: date-time
    Job:
      type: object
      description: A job definition
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        steps:
          type: string
          description: JSON array of Step objects
        variables_config:
          type: string
          description: JSON object mapping variable names to sources
        delivery_config:
          type: string
          description: JSON DeliveryConfig object
        timeout_ms:
          type: integer
        enabled:
          type: boolean
        api_key_id:
          type: string
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/TriggerResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JobRun:
      type: object
      description: A single execution of a job
      properties:
        id:
          type: string
        job_id:
          type: string
        trigger_id:
          type: string
        status:
          type: string
          enum: [pending, running, success, failed, interrupted, llm_failed, llm_success, delivery_failed, skipped_locked, dead_letter]
        attempts:
          type: integer
          description: Number of execution attempts so far
        last_error:
          type: string
          nullable: true
          description: Error message from the most recent failed attempt
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: Scheduled time for the next retry attempt
        llm_result:
          type: string
          nullable: true
        llm_error:
          type: string
          nullable: true
        delivery_result:
          type: string
          nullable: true
        delivery_error:
          type: string
          nullable: true
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        cost:
          type: number
          format: double
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
        request_body:
          type: string
          nullable: true
        execution_key:
          type: string
          nullable: true
    JobStats:
      type: object
      description: Aggregate job statistics
      properties:
        jobs:
          type: object
          properties:
            total:
              type: integer
            enabled:
              type: integer
        executions:
          type: object
          properties:
            total:
              type: integer
            errors:
              type: integer
        recent:
          type: array
          items:
            $ref: '#/components/schemas/JobRun'
  responses:
    Unauthorized:
      description: Authentication failed or token missing
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
    BadRequest:
      description: Malformed request payload
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string

    PIIBlocked:
      description: Request blocked due to PII detection
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                  pii_type:
                    type: string
                    description: Type of PII detected (e.g., 'ssn', 'email', 'credit_card', 'tckn')
                  mode:
                    type: string
                    description: The PII mode that triggered the block
                    example: block
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                    example: model_not_found
                  code:
                    type: string
                    example: "404"
    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                    example: rate_limit_exceeded
                  code:
                    type: string
                    example: "429"
    ProviderError:
      description: All upstream providers failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                    example: provider_error
                  code:
                    type: string
                    example: "502"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                    example: internal_error
                  code:
                    type: string
                    example: "500"
    OAuthError:
      description: OAuth error response (RFC 6749 Section 5.2)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: OAuth error code
                example: invalid_request
              error_description:
                type: string
                description: Human-readable error description
                example: client_id is required
