openapi: 3.1.0
info:
  title: ILTER Gateway API
  description: Secure, cost-optimizing LLM Gateway with built-in PII masking, loop detection, and load balancing.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:9191
    description: Dashboard Server
paths:
  /healthz:
    get:
      tags: [Admin]
      servers:
        - url: http://127.0.0.1:9192
      summary: Health check
      description: Returns OK when the gateway is running.
      responses:
        '200':
          description: Health check successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      summary: Prometheus Metrics
      description: Returns OpenTelemetry metrics scrape target (port 9192).
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            text/plain:
              schema:
                type: string
  /api/usage:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get Key Usage Statistics
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Key usage statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        api_key_id:
                          type: integer
                        name:
                          type: string
                        used_budget:
                          type: number
                        request_count:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/cache/flush:
    post:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Flush Semantic Cache
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cache flushed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: flushed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/chat/completions:
    post:
      tags: [Proxy]
      servers:
        - url: http://127.0.0.1:8181
      summary: Proxy Chat Completion
      description: Proxies chat completions to the load-balanced providers.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                model:
                  type: string
                  example: gpt-4o
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant, tool]
                        example: user
                      content:
                        type: string
                        example: Hello, how are you?
                stream:
                  type: boolean
                  example: false
                temperature:
                  type: number
                  minimum: 0.0
                  maximum: 2.0
                  example: 0.7
                max_tokens:
                  type: integer
                  minimum: 1
                  example: 1024
      responses:
        '200':
          description: Completion successful
          headers:
            X-Ilter-Complexity-Score:
              schema:
                type: number
                description: Complexity score of the prompt (0.0–10.0)
            X-Ilter-Model-Selected:
              schema:
                type: string
                description: The model selected by smart routing
            X-Ilter-Cost:
              schema:
                type: number
                description: Actual cost in USD for this request (non-streaming only)
            X-Ilter-Cost-Estimate:
              schema:
                type: number
                description: Estimated cost in USD for this request
            X-Ilter-Alternative-Cost:
              schema:
                type: number
                description: Estimated cost if using an alternative model
            X-Ilter-Savings-Potential:
              schema:
                type: string
                description: Savings percentage compared to alternative
                example: 45%
            X-Ilter-Loop-Warning:
              schema:
                type: boolean
                description: Indicates potential agentic loop detected
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                            content:
                              type: string
                        finish_reason:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PIIBlocked'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/ProviderError'
  /v1/models:
    get:
      tags: [Proxy]
      servers:
        - url: http://127.0.0.1:8181
      summary: List Models
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                        created:
                          type: integer
                        owned_by:
                          type: string
                        provider:
                          type: string
                        type:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /:
    get:
      tags: [Proxy]
      servers:
        - url: http://127.0.0.1:8181
      summary: Dashboard UI
      description: Serves the built-in HTML/CSS/JS admin dashboard.
      responses:
        '200':
          description: Dashboard HTML page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stats:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get Topline Dashboard Statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_requests:
                    type: integer
                  total_cost:
                    type: number
                  estimated_savings:
                    type: number
                  success_count:
                    type: integer
                  error_count:
                    type: integer
                  cache_hits:
                    type: integer
                  avg_latency_ms:
                    type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/requests:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get Audit Logs list
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [success, error]
          description: Filter by response status
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Filter by model name (LIKE match)
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        timestamp:
                          type: string
                          format: date-time
                        api_key_id:
                          type: integer
                        model:
                          type: string
                        provider:
                          type: string
                        prompt_tokens:
                          type: integer
                        completion_tokens:
                          type: integer
                        total_cost:
                          type: number
                        latency_ms:
                          type: integer
                        status_code:
                          type: integer
                        cache_hit:
                          type: boolean
                        prompt_preview:
                          type: string
                        request_body:
                          type: string
                        response_body:
                          type: string
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/costs:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get Cost Attribution with Time Series and Savings
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: ["24h", "7d", "30d"]
            default: "7d"
          description: Time period for cost breakdown (24h, 7d, 30d)
      responses:
        '200':
          description: Cost attribution retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_cost:
                    type: number
                    format: double
                  total_requests:
                    type: integer
                  avg_cost_per_request:
                    type: number
                    format: double
                  period:
                    type: string
                  by_provider:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        cost:
                          type: number
                          format: double
                        count:
                          type: integer
                        pct:
                          type: number
                          format: double
                  time_series:
                    type: array
                    items:
                      type: object
                      properties:
                        period:
                          type: string
                        cost:
                          type: number
                          format: double
                        count:
                          type: integer
                  savings_summary:
                    type: object
                    properties:
                      routing_savings:
                        type: number
                        format: double
                      cache_savings:
                        type: number
                        format: double
                      total_savings:
                        type: number
                        format: double
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/models:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get Active Models List
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Models list retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    provider:
                      type: string
                    type:
                      type: string
                    owned_by:
                      type: string
                    active:
                      type: boolean
                    configured:
                      type: boolean
                    display_name:
                      type: string
                    tier:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/loops:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get Loop Events list
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Loop events retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    detected_at:
                      type: string
                      format: date-time
                    api_key_id:
                      type: integer
                    client_ip:
                      type: string
                    prompt_hash:
                      type: string
                    repeat_count:
                      type: integer
                    window_seconds:
                      type: integer
                    action_taken:
                      type: string
                    resolved_at:
                      type: string
                      format: date-time
                      nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pii-events:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get PII Detection Events list
      security:
        - BearerAuth: []
      parameters:
        - name: pii_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by PII type
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Filter by action taken (masked, blocked)
        - name: key_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by API key ID
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Start date filter
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: End date filter
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: PII events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        timestamp:
                          type: string
                          format: date-time
                        api_key_id:
                          type: integer
                        api_key_name:
                          type: string
                        pii_type:
                          type: string
                        action_taken:
                          type: string
                        client_ip:
                          type: string
                        request_id:
                          type: integer
                          nullable: true
                        masked_prompt_preview:
                          type: string
                          nullable: true
                        model:
                          type: string
                          nullable: true
                        provider:
                          type: string
                          nullable: true
                        latency_ms:
                          type: integer
                          nullable: true
                        total_cost:
                          type: number
                          nullable: true
                        cache_hit:
                          type: boolean
                          nullable: true
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  total_pages:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/optimize:
    post:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Optimization Model Recommendation Helper
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
                - current_model
              properties:
                prompt:
                  type: string
                  example: Say hello.
                current_model:
                  type: string
                  example: gpt-4o
      responses:
        '200':
          description: Recommendations computed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  complexity_score:
                    type: number
                  current_cost_estimate:
                    type: number
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        model:
                          type: string
                        tier:
                          type: string
                        input_cost:
                          type: number
                        output_cost:
                          type: number
                        savings_percent:
                          type: number
                        reason:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/models/toggle:
    post:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Toggle model enabled status
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - active
              properties:
                name:
                  type: string
                  example: gpt-4o
                active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Model status toggled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Model not found
        '400':
          description: Invalid request
  /api/models/tier:
    post:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Update model tier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - tier
              properties:
                name:
                  type: string
                  example: gpt-4o
                tier:
                  type: string
                  enum: [free, economy, standard, premium]
                  example: premium
      responses:
        '200':
          description: Model tier updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Model not found
        '400':
          description: Invalid tier value
  /api/pii-stats:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get PII detection statistics
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: PII statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                  blocked_count:
                    type: integer
                  masked_count:
                    type: integer
                  blocked_rate:
                    type: number
                  type_breakdown:
                    type: object
                    additionalProperties:
                      type: integer
                  top_keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key_id:
                          type: integer
                        event_count:
                          type: integer
                  recent_trend:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/pii-export:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Export PII events as CSV
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: pii_type
          in: query
          required: false
          schema:
            type: string
          description: Filter by PII type
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 1000
            minimum: 1
            maximum: 10000
      responses:
        '200':
          description: PII events exported successfully
          content:
            text/csv:
              schema:
                type: string
                example: date,api_key_id,pii_type,mode\n2024-01-01T00:00:00Z,123,email,mask
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    api_key_id:
                      type: integer
                    pii_type:
                      type: string
                    action_taken:
                      type: string
                    client_ip:
                      type: string
                    request_id:
                      type: integer
                      nullable: true
                    model:
                      type: string
                      nullable: true
                    provider:
                      type: string
                      nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /providers:
    get:
      tags: [Admin]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get active provider backends
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Providers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    base_url:
                      type: string
                    models:
                      type: array
                      items:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin]
      servers:
        - url: http://127.0.0.1:9191
      summary: Create or update provider configuration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - base_url
                - api_key
              properties:
                name:
                  type: string
                  example: openai
                base_url:
                  type: string
                  example: https://api.openai.com/v1
                api_key:
                  type: string
                  example: sk-...
      responses:
        '200':
          description: Provider configuration saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid provider configuration
  /api/providers:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get active provider backends
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Providers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    base_url:
                      type: string
                    models:
                      type: array
                      items:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Create or update provider configuration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - base_url
                - api_key
              properties:
                name:
                  type: string
                  example: openai
                base_url:
                  type: string
                  example: https://api.openai.com/v1
                api_key:
                  type: string
                  example: sk-...
      responses:
        '200':
          description: Provider configuration saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Invalid provider configuration
  /api/smart-router/stats:
    get:
      tags: [Dashboard]
      servers:
        - url: http://127.0.0.1:9191
      summary: Get smart router statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Smart router stats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    properties:
                      strategy:
                        type: string
                      default_model:
                        type: string
                      complexity_thresholds:
                        type: object
                        properties:
                          economy:
                            type: number
                          standard:
                            type: number
